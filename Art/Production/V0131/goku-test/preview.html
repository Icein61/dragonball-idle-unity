<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>悟空 · 动作样片</title>
<style>
:root{color-scheme:light;--ink:#153c3b;--paper:#f4f1e7;--card:#fffdf7;--gold:#997039;--muted:#47615d;--line:#dcd6c3;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}main{max-width:1056px;margin:auto;padding:42px 26px 48px}h1{margin:0;font-size:clamp(27px,5vw,42px);letter-spacing:.03em}p{line-height:1.55}header p{margin:8px 0 23px;color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab,.control{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 13px}.tab{display:flex;align-items:center;gap:8px;min-height:45px}.tab[aria-pressed=true],#play{background:var(--ink);color:#fffdf7;border-color:var(--ink)}.icon{display:inline-block;width:28px;height:28px;border-radius:5px;background-repeat:no-repeat;background-image:url(skill-icons.png);background-size:200% 200%}.passive-icon{background-image:url(passive-training.png);background-position:center;background-size:contain}.viewer{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}canvas{display:block;width:100%;height:auto;background:#f1eee4}.panel{padding:15px 18px 19px}.track{width:100%;accent-color:#255352;margin:11px 0}.controls,.status{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status{justify-content:space-between;font-size:14px;margin:0}.status output{font-variant-numeric:tabular-nums;color:var(--muted)}.note{margin:10px 0 0;font-size:13px;color:var(--muted)}.frames{display:flex;gap:8px;overflow:auto;margin-top:13px;padding:3px 3px 8px}.frame{flex:0 0 128px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 6px 8px;text-align:center;font-size:13px}.frame[aria-current=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.frame canvas{height:73px;width:100%;object-fit:contain;background:#f6f2e8;border-radius:5px;margin-bottom:5px}.frames::-webkit-scrollbar{height:7px}.frames::-webkit-scrollbar-thumb{background:#b6b0a0;border-radius:8px}
@media(max-width:540px){main{padding:24px 12px}.tab,.control{padding:8px}.panel{padding:12px}.frame{flex-basis:104px}}
</style>
</head>
<body>
<main>
<header><h1>悟空 · 动作样片</h1><p>赛亚人篇 · 连续动作预览</p></header>
<nav aria-label="动作" id="tabs"></nav>
<section class="viewer" aria-label="动作播放器">
<canvas id="stage" width="960" height="404" role="img" aria-label="悟空动作演示"></canvas>
<div class="panel">
<p class="status"><strong id="pose"></strong><output id="time" for="scrub"></output></p>
<input class="track" id="scrub" aria-label="播放进度" type="range" min="0" step="1" value="0">
<div class="controls">
<button class="control" id="play" type="button">播放</button>
<button class="control" id="previous" type="button">上一帧</button>
<button class="control" id="next" type="button">下一帧</button>
<label><input id="slow" type="checkbox"> 0.5 倍速</label><label id="sweep-option" hidden><input id="sweep" type="checkbox"> 演示扫堂腿</label>
</div>
<p class="note" id="note"></p>
</div>
</section>
<div class="frames" id="frames" aria-label="关键帧列表"></div>
<p class="note" id="error" role="alert" hidden></p>
</main>
<script src="motion-art.js"></script><script src="motion-timing.js"></script><script src="motion.js"></script></body></html>
